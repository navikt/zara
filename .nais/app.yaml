apiVersion: 'nais.io/v1alpha1'
kind: 'Application'
metadata:
  name: zara
  namespace: tsm
  labels:
    team: tsm

spec:
  port: 3000
  leaderElection: true

  azure:
    application:
      enabled: true
      allowAllUsers: false
    sidecar:
      enabled: true
      autoLogin: true
      autoLoginIgnorePaths:
        - /api/*
        - /favicon.ico

  valkey:
    - instance: syk-inn
      access: readwrite

  observability:
    autoInstrumentation:
      enabled: true
      runtime: nodejs
    logging:
      destinations:
        - id: loki
  prometheus:
    enabled: true
    path: /api/internal/metrics
  liveness:
    path: /api/internal/is_alive
  readiness:
    path: /api/internal/is_ready
  preStopHook:
    http:
      path: /api/internal/pre_stop
  filesFrom:
    - emptyDir:
        medium: Memory
      mountPath: /app/.next/cache

  accessPolicy:
    outbound:
      external:
        - host: cdn.nav.no
        - host: api.slack.com
        - host: wss-primary.slack.com
      rules:
        - application: syk-inn-api
        - application: regulus-maximus
        - application: tsm-pdl-cache
        - application: syfohelsenettproxy
          namespace: teamsykmelding
        - application: logging
          namespace: nais-system

  envFrom:
    - secret: tsm-zara-secrets
    - secret: tsm-ident-hash
